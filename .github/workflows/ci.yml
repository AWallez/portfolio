name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend — lint, typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b --noEmit

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --run

      # échoue si une dépendance présente une faille high/critical
      - name: Audit
        run: npm audit --audit-level=high

  backend:
    name: Backend — typecheck, tests & audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Audit
        run: npm audit --audit-level=high

  admin:
    name: Admin (CRM) — typecheck & audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      # --- serveur ---
      - name: Install dependencies (server)
        run: npm ci

      - name: Typecheck (server)
        run: npm run typecheck

      - name: Audit (server)
        run: npm audit --audit-level=high

      # --- front admin (build vérifie aussi les types) ---
      - name: Install dependencies (web)
        working-directory: admin/web
        run: npm ci

      - name: Build (web)
        working-directory: admin/web
        run: npm run build

      - name: Audit (web)
        working-directory: admin/web
        run: npm audit --audit-level=high
