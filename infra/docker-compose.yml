# Stack complète du portfolio — à déployer sur le NAS.
# Démarrage :
#   1. cp .env.example .env  (puis remplir .env)
#   2. docker compose up -d --build
#   3. docker compose run --rm --no-deps migrate   (schéma + comptes ; deploy.sh le fait)
# Le service `web` (Nginx) sert le SPA et proxy /api → `api` (même origine).
# Brancher le reverse proxy + HTTPS d'UGOS sur ${WEB_PORT}.

# Journaux Docker plafonnés (3 fichiers de 10 Mo par conteneur). Sans ça, le
# pilote json-file par défaut écrit sans limite sur le disque du NAS.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Limites de mémoire : la RAM est la ressource rare du NAS (7,5 Gio pour une
# trentaine de conteneurs). Un service qui s'emballe est relancé par Docker au
# lieu d'affamer les autres. Mesures du 11/10/2026 au repos : api 73 Mio et
# admin 75 (avec tsx), postgres 15, ntfy 40, caddy 35, web 10 ; d'où des
# plafonds larges, à resserrer après quelques semaines de mesures.

services:
  postgres:
    image: postgres:17-alpine
    container_name: portfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Aucun port publié : Postgres n'est joignable que par l'API via le réseau Docker
    # interne. (Pour un accès admin ponctuel : `docker compose exec postgres psql ...`.)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    logging: *logging

  # --- Migration : schéma, comptes applicatifs et leurs droits (backend/db/). ---
  # Conteneur jetable, sous le compte PROPRIÉTAIRE de la base. Hors du démarrage
  # normal (profil) : lancé par deploy.sh avec `docker compose run --rm --no-deps
  # migrate`. Hors de postgres, seul ce service connaît ce compte : l'API et l'admin
  # n'ont que leurs comptes limités (api_app, admin_app).
  migrate:
    image: postgres:17-alpine
    profiles: ["migrate"]
    entrypoint: ["sh", "/db/migrate.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      # mots de passe posés sur les comptes (vides = inchangés, cf. roles.sql)
      API_DB_PASSWORD: ${API_DB_PASSWORD:-}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:-}
    volumes:
      - ../backend/db:/db:ro
    logging: *logging

  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: portfolio-ntfy
    command: serve
    restart: unless-stopped
    environment:
      NTFY_BASE_URL: ${NTFY_BASE_URL}
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_CACHE_DURATION: "12h"
      # Relais APNs pour les notifs push iOS (app fermée).
      # Seul un "réveil" anonyme passe par ntfy.sh ; le message reste sur le NAS.
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
      # Auth : tout est refusé par défaut. On crée un user + token (write) pour l'API
      # et on connecte l'appli du tél avec ce compte (read). Base persistée dans le volume.
      NTFY_AUTH_FILE: /var/cache/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      # Derrière Caddy (ntfy.alexiswallez.fr) : sans ça, ntfy voit l'IP de Caddy
      # pour TOUS les clients publics, qui partagent alors un seul compteur
      # anti-abus. Une trentaine de mauvais mots de passe venus de n'importe où
      # suffisaient à couper les notifications du téléphone hors de la maison.
      NTFY_BEHIND_PROXY: "true"
    ports:
      - "8080:80"
    volumes:
      - ntfy_data:/var/cache/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 128m
    logging: *logging

  # --- API Fastify (containerisée). Aucun port hôte : joignable seulement via `web`. ---
  api:
    build:
      context: ../backend
      # réseau hôte pendant le build : les RUN (npm ci) sont sinon droppés par
      # le pare-feu UGOS en « Accès refusé » (même piège que caddy-ratelimit)
      network: host
      # commit gravé dans l'image, lu par infra/check-drift.sh (deploy.sh exporte
      # GIT_SHA ; « unknown » si on build à la main sans passer par lui)
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: portfolio-api
    restart: unless-stopped
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      # Postgres via le réseau interne (nom de service), pas le port 55432 du LAN
      # compte limité (INSERT + purge RGPD, cf. backend/db/roles.sql), plus le
      # superutilisateur : une faille de l'API ne donne plus toute la base
      DATABASE_URL: postgres://${API_DB_USER:-api_app}:${API_DB_PASSWORD:-}@postgres:5432/${POSTGRES_DB}
      NTFY_URL: http://ntfy:80
      NTFY_TOPIC: ${NTFY_TOPIC}
      NTFY_TOKEN: ${NTFY_TOKEN:-} # token de publication ntfy (auth activée)
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-} # secret anti-bot Cloudflare Turnstile
      CORS_ORIGIN: ${SITE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      ntfy:
        condition: service_started
    healthcheck:
      # 127.0.0.1 (pas localhost) : dans le conteneur, localhost résout d'abord en
      # IPv6 ::1, or l'API n'écoute qu'en IPv4 → "connection refused" au healthcheck.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 192m
    logging: *logging

  # --- Outil admin/CRM interne : suivi des messages du formulaire + explorateur
  # BDD. Aucun port publié : servi par Caddy sur crm.alexiswallez.fr, en HTTPS,
  # au réseau local et au VPN seulement (cf. Caddyfile). Avant : HTTP sur le
  # port 8100, mot de passe et cookie en clair sur le Wi-Fi. ---
  admin:
    build:
      context: ../admin
      # réseau hôte pendant le build : les RUN (npm ci) sont sinon droppés par
      # le pare-feu UGOS en « Accès refusé » (même piège que caddy-ratelimit)
      network: host
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: portfolio-admin
    restart: unless-stopped
    environment:
      PORT: 3002
      HOST: 0.0.0.0
      # compte PostgreSQL limité aux contacts (backend/db/roles.sql), créé et
      # tenu à jour par le service `migrate`
      DATABASE_URL_ADMIN: postgres://${ADMIN_DB_USER}:${ADMIN_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      SESSION_SECRET: ${ADMIN_SESSION_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3002/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 192m
    logging: *logging

  # --- Frontend : Nginx sert dist/ et proxy /api → api (même origine, zéro CORS). ---
  web:
    build:
      context: ../frontend
      network: host
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: portfolio-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 64m
    logging: *logging
    # Aucun port publié : seul `caddy` (8081/8443) est l'entrée publique → il
    # joint `web` via le réseau Docker interne. (Plus d'accès LAN direct en 8088.)

  # --- Reverse proxy public + HTTPS auto (Let's Encrypt). Seule entrée 80/443. ---
  caddy:
    image: caddy:2-alpine
    container_name: portfolio-caddy
    restart: unless-stopped
    # `service_started` et non `service_healthy` : Caddy porte TOUS les sites
    # publics du NAS (Jellyfin, Vaultwarden, stats…). Un `web` en panne ne doit
    # pas l'empêcher de redémarrer, et d'emporter les autres avec lui.
    depends_on:
      web:
        condition: service_started
    mem_limit: 256m
    logging: *logging
    ports:
      # 80/443 du NAS sont pris par le nginx système d'UGOS, et 8080 par ntfy →
      # on écoute sur 8081/8443 ; la box redirige le 80/443 public vers eux (NAT).
      - "8081:80"
      - "8443:443"
      - "8443:443/udp" # HTTP/3 (QUIC)
    # NB : sur la machine de déploiement, un docker-compose.override.yml LOCAL
    # (non versionné, chargé automatiquement) peut enrichir ce service :
    # image Caddy avec plugins + réseaux d'autres stacks pour les blocs conf.d/.
    # ⚠️ Caddyfile monté en FICHIER seul : git le remplace par un nouveau fichier
    # à chaque pull, et le conteneur garde l'ancien jusqu'à son redémarrage (un
    # `caddy reload` relirait l'ancien contenu). deploy.sh valide donc le
    # nouveau Caddyfile, puis redémarre caddy quand il a changé.
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./conf.d:/etc/caddy/conf.d:ro # blocs locaux importés (gitignorés)
      - caddy_data:/data # certificats Let's Encrypt — À PERSISTER (rate-limit ACME)
      - caddy_config:/config

volumes:
  postgres_data:
  ntfy_data:
  caddy_data:
  caddy_config:
